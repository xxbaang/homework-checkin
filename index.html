<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>作业打卡表</title>
<style>
:root{--ink:#182433;--line:#cbd5e1;--blue:#1769aa;--gold:#f59e0b;--red:#dc2626;--muted:#64748b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f0f5f9;font-family:"Microsoft YaHei",system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px max(16px,env(safe-area-inset-right)) 38px}header{padding:8px 2px 16px}h1{font-size:25px;margin:0 0 6px}.hint{margin:0;color:var(--muted);font-size:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #1e293b12}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#334155;font-weight:700}input,textarea{margin-top:6px;width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;color:var(--ink);background:white}textarea{resize:vertical;min-height:78px}.wide{grid-column:1/-1}.table-card{padding:0;overflow:hidden}.table-title{padding:12px 14px;border-bottom:1px solid #e2e8f0;font-weight:800;display:flex;justify-content:space-between;align-items:center}.legend{font-size:12px;color:var(--muted);font-weight:400}.calendar{display:grid;grid-template-columns:repeat(5,1fr)}.day{min-height:62px;background:white;border:0;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:5px 4px;appearance:none;text-align:left;color:var(--ink);cursor:pointer}.day:nth-child(5n){border-right:0}.number{font-weight:800;font-size:13px}.date{display:block;color:var(--muted);font-size:9px;margin-top:1px}.mark{display:block;text-align:center;font-size:28px;line-height:30px}.none .mark{color:#cbd5e1;font-size:20px}.excellent .mark{color:var(--gold)}.revise .mark{color:var(--blue)}.incomplete .mark{color:var(--red)}.feedback{border-top:1px solid #e2e8f0;padding:11px 14px;font-size:14px;white-space:pre-wrap;min-height:48px}.feedback b{display:block;margin-bottom:4px}.actions{display:flex;gap:10px;margin-top:14px}.action{flex:1;padding:12px;border:0;border-radius:10px;color:white;background:var(--blue);font:inherit;font-weight:700;cursor:pointer}.secondary{background:#64748b}dialog{border:0;border-radius:16px;width:min(92vw,420px);padding:0;box-shadow:0 16px 50px #0f172a55}dialog::backdrop{background:#0f172a75}.dialog-body{padding:20px}.dialog-body h2{margin:0 0 14px;font-size:20px}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status-grid button{min-height:50px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit;font-weight:700;cursor:pointer}.student-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-height:275px;overflow:auto;padding:2px}.student-picker button{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:700;cursor:pointer}.student-picker button.is-selected,.student-picker button:disabled{background:#cbd5e1;color:#64748b;border-color:#cbd5e1}.student-picker button:disabled{cursor:not-allowed}@media(max-width:420px){main{padding:12px 10px 28px}.card{border-radius:13px;padding:13px}.day{min-height:58px;padding:5px 3px}.mark{font-size:26px;line-height:28px}}@media print{@page{size:A4 landscape;margin:7mm}body{background:#fff}main{max-width:none;padding:0}header{padding:0 0 5px}h1{font-size:19px}.hint,.actions{display:none}.card{box-shadow:none;border:1px solid #94a3b8;border-radius:0;margin:5px 0;padding:8px}.form{gap:6px}.form textarea,.form input{padding:5px;min-height:34px;font-size:11px}.table-card{padding:0}.table-title{padding:6px 8px}.calendar{grid-template-columns:repeat(9,1fr)}.day{min-height:48px;padding:3px;border-right:1px solid #94a3b8}.day:nth-child(5n){border-right:1px solid #94a3b8}.day:nth-child(9n){border-right:0}.number{font-size:10px}.date{display:none}.mark{font-size:23px;line-height:26px}.feedback{padding:6px 8px;min-height:35px;font-size:11px}}
</style></head><body><main>
<header><h1>作业打卡表</h1><p class="hint">填写作业内容；点击学生学号即可记录作业情况。</p></header>
<section class="card form"><label class="wide">作业日期<input id="workDate" type="date"></label><label class="wide">作业内容<textarea id="homework" placeholder="例如：完成数学练习册第 12 页；朗读课文 20 分钟"></textarea></label><label class="wide">情况反馈<textarea id="feedbackInput" placeholder="例如：本周完成认真，注意书写规范。"></textarea></label></section>
<section class="card table-card"><div class="table-title"><span id="sheetTitle">学生作业情况</span><span class="legend">优秀 ★　待订正 ○　未完成 ×</span></div><div id="calendar" class="calendar"></div><div class="feedback"><b>情况反馈</b><span id="feedbackView">尚未填写</span></div></section>
<div class="actions"><button class="action" id="batch">批量记录</button><button class="action secondary" id="clear">清空打卡</button><button class="action" id="print">打印 / 导出 PDF</button></div></main>
<dialog id="editor"><div class="dialog-body"><h2 id="dialogTitle">记录作业情况</h2><div class="status-grid"><button data-status="excellent">★ 优秀</button><button data-status="revise">○ 待订正</button><button data-status="incomplete">× 未完成</button><button data-status="none">清除标记</button></div><label style="margin-top:14px">当天备注（可选）<textarea id="note" placeholder="例如：订正第 3 题"></textarea></label><div class="actions"><button class="action secondary" id="cancel">取消</button><button class="action" id="save">保存</button></div></div></dialog>
<dialog id="batchEditor"><div class="dialog-body"><h2>批量记录作业情况</h2><p class="hint" style="margin:0 0 10px">点选学生学号；选中后会变灰，不能重复选择。</p><div class="student-picker" id="studentPicker"></div><div class="actions"><button class="action secondary" id="batchReset">重新选择</button><button class="action secondary" id="batchCancel">取消</button></div><div class="status-grid"><button data-batch-status="excellent">★ 优秀</button><button data-batch-status="revise">○ 待订正</button><button data-batch-status="incomplete">× 未完成</button><button data-batch-status="none">清除标记</button></div><div class="actions"><button class="action" id="batchSave">应用到已选学生</button></div></div></dialog>
<script>
const $=id=>document.getElementById(id),fields=['homework','feedbackInput'];let state=JSON.parse(localStorage.getItem('homeworkCheckin')||'{"records":{}}'),chosen=null,pending='none',batchStatus='excellent';if(!state.records){state.records={};if(state.marks||state.homework||state.feedbackInput)state.records[new Date().toISOString().slice(0,10)]={marks:state.marks||{},homework:state.homework||'',feedbackInput:state.feedbackInput||''}}const today=new Date().toISOString().slice(0,10);$('workDate').value=state.selectedDate||today;function record(){const date=$('workDate').value||today;state.selectedDate=date;return state.records[date]||(state.records[date]={marks:{},homework:'',feedbackInput:''})}function persist(){localStorage.setItem('homeworkCheckin',JSON.stringify(state))}function loadRecord(){const r=record();fields.forEach(k=>$(k).value=r[k]||'');persist();render()}fields.forEach(k=>$(k).addEventListener('input',()=>{record()[k]=$(k).value;persist();render()}));$('workDate').addEventListener('change',loadRecord);function render(){const r=record();$('feedbackView').textContent=r.feedbackInput||'尚未填写';const cal=$('calendar');cal.innerHTML='';for(let n=1;n<=45;n++){let m=r.marks?.[n]||{status:'none'},b=document.createElement('button');b.className='day '+m.status;b.innerHTML='<span class="number">学号 '+n+'</span><span class="date">点击记录</span><span class="mark">'+(m.status==='excellent'?'★':m.status==='revise'?'○':m.status==='incomplete'?'×':'·')+'</span>';b.title=m.note||'点击记录';b.onclick=()=>openEditor(n);cal.appendChild(b)}}function openEditor(n){chosen=n;const m=record().marks?.[n]||{status:'none',note:''};pending=m.status;$('note').value=m.note||'';$('dialogTitle').textContent='学号 '+n+' 的作业情况';$('editor').showModal()}document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{pending=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.style.outline='');b.style.outline='3px solid #1769aa'});$('cancel').onclick=()=>$('editor').close();$('save').onclick=()=>{const r=record();r.marks[chosen]={status:pending,note:$('note').value};persist();$('editor').close();render()};$('clear').onclick=()=>{if(confirm('确定清空此日期下全部 45 位学生的打卡标记吗？')){record().marks={};persist();render()}};$('print').onclick=()=>window.print();$('batch').onclick=()=>{$('batchNumbers').value='';batchStatus='excellent';$('batchEditor').showModal()};$('batchCancel').onclick=()=>$('batchEditor').close();document.querySelectorAll('[data-batch-status]').forEach(b=>b.onclick=()=>{batchStatus=b.dataset.batchStatus;document.querySelectorAll('[data-batch-status]').forEach(x=>x.style.outline='');b.style.outline='3px solid #1769aa'});$('batchSave').onclick=()=>{const numbers=new Set();$('batchNumbers').value.split(/[,，\s]+/).filter(Boolean).forEach(part=>{const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],z=+m[2];for(let i=Math.min(a,z);i<=Math.max(a,z);i++)if(i>=1&&i<=45)numbers.add(i)}else if(/^\d+$/.test(part)&&+part>=1&&+part<=45)numbers.add(+part)});if(!numbers.size){alert('请输入 1–45 之间的学号，例如：1, 3-8, 15');return}const r=record();numbers.forEach(n=>r.marks[n]={status:batchStatus,note:''});persist();$('batchEditor').close();render()};loadRecord();
</script><script>
/* Replace text entry with a touch-friendly student-number picker. */
let selectedForBatch=new Set(),selectedBatchStatus='excellent';
function drawStudentPicker(){const picker=document.getElementById('studentPicker'),current=state.records[document.getElementById('workDate').value];picker.innerHTML='';for(let n=1;n<=45;n++){const button=document.createElement('button'),hasRecord=current.marks[n]&&current.marks[n].status!=='none';button.type='button';button.textContent=n;button.disabled=hasRecord;button.classList.toggle('is-selected',selectedForBatch.has(n));button.onclick=()=>{if(selectedForBatch.has(n))selectedForBatch.delete(n);else selectedForBatch.add(n);drawStudentPicker()};picker.appendChild(button)}}
document.getElementById('batch').onclick=()=>{selectedForBatch=new Set();selectedBatchStatus='excellent';drawStudentPicker();document.getElementById('batchEditor').showModal()};
document.getElementById('batchCancel').onclick=()=>document.getElementById('batchEditor').close();
document.getElementById('batchReset').onclick=()=>{selectedForBatch=new Set();drawStudentPicker()};
document.querySelectorAll('[data-batch-status]').forEach(button=>button.onclick=()=>{selectedBatchStatus=button.dataset.batchStatus;document.querySelectorAll('[data-batch-status]').forEach(item=>item.style.outline='');button.style.outline='3px solid #1769aa'});
document.getElementById('batchSave').onclick=()=>{if(!selectedForBatch.size){alert('请先点选至少一位学生');return}const date=document.getElementById('workDate').value;const current=state.records[date];selectedForBatch.forEach(n=>current.marks[n]={status:selectedBatchStatus,note:''});persist();document.getElementById('batchEditor').close();render()};
</script></body></html>
